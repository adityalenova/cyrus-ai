<!doctype html>
<!-- ══ github-callback.html — GitHub OAuth popup landing page ═
     GitHub redirects here after authorization. We hand the code back to
     the opener tab via postMessage and close; nothing is stored here. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cyrus.ai - GitHub sign-in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea;
           font: 15px/1.6 -apple-system, "Segoe UI", Inter, sans-serif; color: #241b13; }
    .box { text-align: center; padding: 32px 28px; border: 1px solid #e3dacc; border-radius: 18px;
           background: #fff; box-shadow: 0 12px 32px rgba(36, 27, 19, .10); max-width: 340px; }
    .m { font-weight: 700; font-size: 17px; } .s { color: #6d5c49; margin-top: 6px; font-size: 13.5px; }
  </style>
</head>
<body>
  <div class="box"><div class="m" id="t">Finishing sign-in…</div><div class="s" id="s">Return to the cyrus.ai tab.</div></div>
  <script>
    var q = new URLSearchParams(location.search);
    var code = q.get("code"), state = q.get("state"), err = q.get("error");
    function say(t, s) { document.getElementById("t").textContent = t; document.getElementById("s").textContent = s; }
    if (window.opener && !window.opener.closed && (code || err)) {
      window.opener.postMessage({ source: "cyrus-github-oauth", code: code, state: state, error: err }, location.origin);
      say("Done - you can close this window.", "Signing you in on cyrus.ai.");
      setTimeout(function () { window.close(); }, 700);
    } else if (err) {
      say("GitHub returned an error.", String(err) + " - close this tab and try again.");
    } else {
      say("Nothing to finish here.", "Start sign-in from the cyrus.ai tab.");
    }
  </script>
</body>
</html>
